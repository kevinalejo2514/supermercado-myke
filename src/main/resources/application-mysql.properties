# ===== Perfil MySQL (produccion / entrega) =====
spring.datasource.url=jdbc:mysql://localhost:3306/supermercado?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# update: Hibernate crea las tablas que falten y agrega columnas nuevas,
# pero NUNCA borra datos existentes.
spring.jpa.hibernate.ddl-auto=update
