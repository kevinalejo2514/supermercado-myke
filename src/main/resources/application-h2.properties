# ===== Perfil H2: base de datos en memoria =====
# Sirve para arrancar y probar la API en Postman SIN instalar MySQL.
# Al reiniciar la aplicacion, los datos desaparecen.
spring.datasource.url=jdbc:h2:mem:supermercado;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop

# Consola de H2 en el navegador: http://localhost:8081/h2-console
spring.h2.console.enabled=true
