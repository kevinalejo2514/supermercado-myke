# ===== Configuracion base =====
spring.application.name=supermercado-api

# Perfil por defecto: H2 (base en memoria, no requiere instalar nada).
# Para usar MySQL: ejecutar con --spring.profiles.active=mysql (ver application-mysql.properties y database/supermercado.sql)
spring.profiles.active=h2

# open-in-view=false: la sesion de Hibernate se cierra al terminar la transaccion.
# Los DTO se mapean DENTRO del servicio (@Transactional), asi que no hay problema.
spring.jpa.open-in-view=false

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

server.port=8081

# ===== Actuator (Spring Boot Dashboard de VS Code) =====
# El panel de Spring Boot lee estos endpoints para mostrar la app "en verde"
# y ofrecer los datos en vivo (beans, mappings, propiedades, metricas...).
# Spring Tools obtiene los datos en vivo por JMX, que Spring Boot desactiva
# por defecto; sin esta propiedad el Dashboard se queda cargando.
spring.jmx.enabled=true

# Los endpoints HTTP tambien se exponen para consultar estos datos en el navegador.
# Por defecto Spring Boot SOLO expone "health".
#
# NOTA de seguridad: "env" publica las propiedades del entorno. En local con H2
# no hay problema, pero NUNCA se expone en produccion.
management.endpoints.web.exposure.include=health,info,beans,mappings,env,metrics,loggers,conditions
management.endpoints.jmx.exposure.include=health,info,beans,mappings,env,metrics,loggers,conditions
management.endpoint.health.show-details=always